name: Auto Bump & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  # ── Job 1 : bump patch auto sur push main ──────────────────────────
  bump:
    if: >-
      github.ref_type != 'tag' &&
      !contains(github.event.head_commit.message, 'chore: bump version')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bump patch version
        id: bump
        run: |
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
      - name: Commit + tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to $(node -p "require('./package.json').version")"
          git tag ${{ steps.bump.outputs.tag }}
          git push origin main --tags

  # ── Job 2 : build + publish (win / mac / linux) ────────────────────
  release:
    needs: [bump]
    if: always() && (needs.bump.result == 'success' || github.ref_type == 'tag')
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    # mac non signé aujourd'hui (pas de certif Apple) : ne bloque pas Windows.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-latest, ubuntu-latest]
    steps:
      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=refs/tags/${{ needs.bump.outputs.tag }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Build (main + preload + renderer)
        run: npm run build
      # Signature de code Windows via Azure Trusted Signing — UNIQUEMENT si les
      # secrets Azure sont configurés (sinon build non signé, toujours téléchargeable ;
      # SmartScreen alertera). mac best-effort. Voir docs/CODE_SIGNING_AZURE.md.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: true
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if [ "${{ matrix.os }}" = "windows-2022" ] && [ -n "$AZURE_CLIENT_ID" ]; then
            echo "Signature Windows via Azure Trusted Signing"
            npx electron-builder --publish always \
              -c.win.azureSignOptions.endpoint="${{ secrets.AZURE_SIGN_ENDPOINT }}" \
              -c.win.azureSignOptions.codeSigningAccountName="${{ secrets.AZURE_SIGN_ACCOUNT }}" \
              -c.win.azureSignOptions.certificateProfileName="${{ secrets.AZURE_SIGN_PROFILE }}"
          else
            npx electron-builder --publish always
          fi
