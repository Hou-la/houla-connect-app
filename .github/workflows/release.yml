name: Auto Bump & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'

# SÉRIALISE les releases : un seul bump+build à la fois. Des pushes rapprochés
# lançaient plusieurs runs en parallèle -> versions désynchronisées, artefacts
# Windows publiés sur la mauvaise release (d'où des releases sans .exe/latest.yml).
concurrency:
  group: auto-bump-release
  cancel-in-progress: false

jobs:
  # ── Job 0 : TESTS (BLOQUANT : rien ne se publie si les TU échouent) ─
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Tests unitaires (node --test)
        run: npm test
      - name: Navigateur Chromium (+ deps système)
        run: npx playwright install --with-deps chromium
      - name: E2E renderer (Playwright + Chromium, API mockée)
        run: npm run test:e2e

  # ── Job 1 : bump patch auto sur push main ──────────────────────────
  bump:
    needs: [test]
    if: >-
      github.ref_type != 'tag' &&
      !contains(github.event.head_commit.message, 'chore: bump version')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bump patch version
        id: bump
        run: |
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
      - name: Commit + tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to $(node -p "require('./package.json').version")"
          git tag ${{ steps.bump.outputs.tag }}
          git push origin main --tags

  # ── Job 2 : build + publish (win / mac / linux) ────────────────────
  release:
    needs: [test, bump]
    if: always() && needs.test.result == 'success' && (needs.bump.result == 'success' || github.ref_type == 'tag')
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    # mac best-effort tant que les secrets Apple ne sont pas posés : ne bloque pas
    # la publication Windows/Linux (une notarisation qui échoue ne casse pas la release).
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-latest, ubuntu-latest]
    steps:
      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=refs/tags/${{ needs.bump.outputs.tag }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Build (main + preload + renderer)
        run: npm run build
      # ── Sidecar Python figé (Windows) : sans cette étape, l'app cherche houla-sidecar.exe
      #    qui n'existe dans aucun build -> la manette virtuelle / le clavier bas niveau
      #    échouent avec « moteur introuvable ». On le fige avec PyInstaller et on empaquette
      #    l'installeur du pilote ViGEmBus. NON bloquant : si le freeze rate, la release part
      #    quand même (sans moteur bas niveau = comportement actuel), avec un ::warning::.
      #    CACHÉ : vgamepad se COMPILE depuis les sources (pas de wheel py3.12) -> ~10-12 min.
      #    On ne le refige QUE si houla_sidecar.py change (clé = son hash) ; sinon on restaure
      #    l'exe + le MSI en quelques secondes. Bump « -vN » si on change la recette de freeze. ──
      - name: Cache du sidecar figé (Windows)
        if: matrix.os == 'windows-2022'
        id: sidecar-cache
        uses: actions/cache@v4
        with:
          path: |
            resources/sidecar/houla-sidecar.exe
            resources/sidecar/ViGEmBusSetup_x64.msi
          key: sidecar-win-py312-${{ hashFiles('resources/sidecar/houla_sidecar.py') }}-v1
      - name: Setup Python (sidecar figé, Windows)
        if: matrix.os == 'windows-2022' && steps.sidecar-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze sidecar (PyInstaller) + bundle pilote ViGEmBus (Windows)
        if: matrix.os == 'windows-2022' && steps.sidecar-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8   # filet anti-hang COURT : si le freeze coince, il est tué à 8 min
        continue-on-error: true   # ... et la release continue quand même (sans le moteur bas niveau)
        shell: bash
        env:
          # vgamepad/setup.py lance un `msiexec /i` INTERACTIF (sans /quiet) pendant pip -> en CI
          # headless la fenêtre attend une interaction et bloque. Cette variable saute cette install
          # (on livre le pilote nous-mêmes, MSI empaqueté + bouton in-app). La DLL/MSI restent bundlés.
          VGAMEPAD_SKIP_VIGEMBUS_INSTALL: 'true'
        run: |
          set +e
          # RE-export dans le shell : le `env:` du step ne semblait pas atteindre le sous-process
          # de build de pip (d'où un hang persistant). L'export garantit l'héritage. L'echo trace.
          export VGAMEPAD_SKIP_VIGEMBUS_INSTALL=true
          echo "VGAMEPAD_SKIP=[${VGAMEPAD_SKIP_VIGEMBUS_INSTALL:-UNSET}]"
          python -m pip install --upgrade pip pyinstaller
          if [ $? -ne 0 ]; then echo "::warning::pip/pyinstaller KO — build SANS moteur manette"; exit 0; fi
          # vgamepad : son setup.py HANG au build en CI (bloc Windows : reg query /s + msiexec),
          # et le sdist 0.1.0 diffère de la branche main (le sed ne matchait pas). On CONTOURNE
          # setup.py ENTIÈREMENT : télécharger la source et COPIER le package `vgamepad/`
          # directement dans site-packages. C'est du Python + des DLL (données) -> il s'importe
          # tel quel, ZÉRO build, ZÉRO hang. Le pilote ViGEmBus, lui, on l'installe in-app.
          python -m pip download vgamepad==0.1.0 --no-deps --no-binary :all: -d vgsrc \
            || { echo "::warning::download vgamepad KO — build SANS moteur manette"; exit 0; }
          tar -xzf vgsrc/vgamepad-*.tar.gz -C vgsrc
          VGDIR=$(find vgsrc -maxdepth 1 -type d -name 'vgamepad-*' | head -1)
          SITE=$(python -c "import site; print(site.getsitepackages()[0])")
          cp -r "$VGDIR/vgamepad" "$SITE/" || { echo "::warning::copie vgamepad KO — build SANS moteur manette"; exit 0; }
          python -c "import vgamepad; print('vgamepad importe OK ->', vgamepad.__file__)" \
            || { echo "::warning::import vgamepad KO apres copie — build SANS moteur manette"; exit 0; }
          # --collect-submodules/data/binaries (PAS --collect-all) : une simple copie n'a pas de
          # dist-info, et --collect-all EXIGE les métadonnées (il planterait). interception (clavier
          # bas niveau) reste hors du freeze (la manette n'en dépend pas ; l'exe se bundle quand même).
          pyinstaller --onefile --name houla-sidecar \
            --collect-submodules vgamepad --collect-data vgamepad --collect-binaries vgamepad \
            resources/sidecar/houla_sidecar.py
          if [ ! -f dist/houla-sidecar.exe ]; then echo "::warning::PyInstaller n'a pas produit houla-sidecar.exe — build SANS moteur bas niveau"; exit 0; fi
          cp dist/houla-sidecar.exe resources/sidecar/houla-sidecar.exe
          # Installeur du pilote ViGEmBus (manette virtuelle) : empaqueté pour l'install in-app (UAC).
          VG=$(python -c "import vgamepad, os; print(os.path.dirname(vgamepad.__file__))")
          MSI=$(find "$VG" -name 'ViGEmBusSetup_x64.msi' 2>/dev/null | head -1)
          if [ -n "$MSI" ] && [ -f "$MSI" ]; then cp "$MSI" resources/sidecar/ViGEmBusSetup_x64.msi; \
            else echo "::warning::MSI ViGEmBus introuvable dans vgamepad — install pilote in-app indisponible"; fi
          echo "Sidecar figé + pilote empaquetés :"; ls -la resources/sidecar/ || true
      # Signature de code, UNIQUEMENT si les secrets sont configurés (sinon build non
      # signé, toujours téléchargeable ; SmartScreen/Gatekeeper alerteront) :
      #   - Windows : Azure Trusted Signing (secrets AZURE_*)
      #   - macOS   : Developer ID + notarisation (secrets APPLE_*)
      #   - Linux   : AppImage, pas de signature de code (rien à faire)
      # Procédure complète (réutilisable pour houla-print) : docs/CODE_SIGNING.md
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: true
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # macOS : signature Developer ID (cert .p12) + notarisation par CLÉ API App Store
          # Connect (pas de mot de passe app-specific). Le job mac ne s'en sert que s'ils
          # existent. Cert nommé APPLE_CSC_* pour NE PAS que le job Windows le prenne comme
          # cert Windows. APPLE_API_KEY_B64 = le .p8 (base64), décodé en fichier dans le run.
          APPLE_CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          APPLE_CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "${{ matrix.os }}" = "windows-2022" ] && [ -n "$AZURE_CLIENT_ID" ]; then
            echo "Signature Windows via Azure Trusted Signing"
            npx electron-builder --publish always \
              -c.win.azureSignOptions.endpoint="${{ secrets.AZURE_SIGN_ENDPOINT }}" \
              -c.win.azureSignOptions.codeSigningAccountName="${{ secrets.AZURE_SIGN_ACCOUNT }}" \
              -c.win.azureSignOptions.certificateProfileName="${{ secrets.AZURE_SIGN_PROFILE }}"
          elif [ "${{ matrix.os }}" = "macos-latest" ] && [ -n "$APPLE_CSC_LINK" ]; then
            echo "Signature Developer ID + notarisation macOS (clé API App Store Connect)"
            export CSC_LINK="$APPLE_CSC_LINK"
            export CSC_KEY_PASSWORD="$APPLE_CSC_KEY_PASSWORD"
            # Décode la clé API .p8 dans un fichier (electron-builder attend un CHEMIN).
            echo "$APPLE_API_KEY_B64" | base64 -d > "$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
            # APPLE_API_KEY_ID + APPLE_API_ISSUER sont déjà dans l'env (bloc env: ci-dessus).
            npx electron-builder --publish always -c.mac.notarize=true
          else
            # Windows/macOS sans secrets, ou Linux (AppImage : pas de signature de code
            # côté desktop Linux) : build non signé, toujours téléchargeable.
            npx electron-builder --publish always
          fi
