name: Auto Bump & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'

# SÉRIALISE les releases : un seul bump+build à la fois. Des pushes rapprochés
# lançaient plusieurs runs en parallèle -> versions désynchronisées, artefacts
# Windows publiés sur la mauvaise release (d'où des releases sans .exe/latest.yml).
concurrency:
  group: auto-bump-release
  cancel-in-progress: false

jobs:
  # ── Job 0 : TESTS (BLOQUANT : rien ne se publie si les TU échouent) ─
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Tests unitaires (node --test)
        run: npm test
      - name: Navigateur Chromium (+ deps système)
        run: npx playwright install --with-deps chromium
      - name: E2E renderer (Playwright + Chromium, API mockée)
        run: npm run test:e2e

  # ── Job 1 : bump patch auto sur push main ──────────────────────────
  bump:
    needs: [test]
    if: >-
      github.ref_type != 'tag' &&
      !contains(github.event.head_commit.message, 'chore: bump version')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bump patch version
        id: bump
        run: |
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
      - name: Commit + tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to $(node -p "require('./package.json').version")"
          git tag ${{ steps.bump.outputs.tag }}
          git push origin main --tags

  # ── Job 2 : build + publish (win / mac / linux) ────────────────────
  release:
    needs: [test, bump]
    if: always() && needs.test.result == 'success' && (needs.bump.result == 'success' || github.ref_type == 'tag')
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    # mac best-effort tant que les secrets Apple ne sont pas posés : ne bloque pas
    # la publication Windows/Linux (une notarisation qui échoue ne casse pas la release).
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-latest, ubuntu-latest]
    steps:
      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=refs/tags/${{ needs.bump.outputs.tag }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Build (main + preload + renderer)
        run: npm run build
      # ── Sidecar manette (Windows) : vgamepad exige le pilote NOYAU ViGEmBus CHARGÉ pour
      #    s'importer (VBUS = VBus() dès son __init__), ce qui demande un redémarrage impossible
      #    sur un runner CI (5 approches de freeze essayées, toutes bloquées par ça). On ne le
      #    build donc PAS ici : l'exe figé + le MSI du pilote sont CONSTRUITS UNE FOIS sur une
      #    vraie machine Windows et publiés dans la release GitHub `sidecar-bin-v1`. Ici on les
      #    TÉLÉCHARGE. NON bloquant : si la release n'existe pas encore, le build part sans le
      #    moteur manette (tout le reste fonctionne), avec un ::warning::. ──
      # ⚠️ CE PAS EST BLOQUANT, ET IL DOIT LE RESTER.
      # Il ne l'était pas, et ça a coûté très cher : les DLL proxy XInput n'ont JAMAIS été
      # téléversées dans `sidecar-bin-v1`. Le téléchargement échouait donc à chaque build,
      # avec un simple `::warning::` que personne ne lit — et TOUTES les versions publiées
      # (jusqu'à la 0.1.61) sont parties SANS ces DLL. « Lier mon jeu », et donc tout le
      # pilotage manette en jeu, était inopérant pour quiconque téléchargeait l'app : ça
      # n'a jamais marché que sur le poste de dev, où les fichiers existent en local
      # (ils sont dans .gitignore). Constaté et corrigé le 2026-09-03.
      #
      # Un artefact manquant doit CASSER LE BUILD, pas produire un avertissement : une
      # release amputée d'une fonction annoncée est pire qu'une release absente.
      # Re-vérification :
      #   gh release view sidecar-bin-v1 --repo Hou-la/houla-connect-app --json assets
      #   -> doit lister houla-sidecar.exe, ViGEmBusSetup_x64.msi ET les 3 xinput*.dll
      - name: Récupérer le sidecar manette pré-construit (Windows)
        if: matrix.os == 'windows-2022'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download sidecar-bin-v1 --repo Hou-la/houla-connect-app \
            --pattern 'houla-sidecar.exe' --dir resources/sidecar --clobber
          gh release download sidecar-bin-v1 --repo Hou-la/houla-connect-app \
            --pattern 'ViGEmBusSetup_x64.msi' --dir resources/sidecar --clobber
          # DLL proxy XInput (font lire la virtuelle comme Joueur 1 quand posées dans le
          # dossier d'un jeu — cf resources/xinput-proxy/proxy.c, « Lier mon jeu »).
          mkdir -p resources/xinput-proxy
          gh release download sidecar-bin-v1 --repo Hou-la/houla-connect-app \
            --pattern 'xinput*.dll' --dir resources/xinput-proxy --clobber
          # Vérification EXPLICITE : un `gh release download` qui ne ramène rien peut
          # réussir. On exige donc de VOIR les fichiers, un par un.
          for f in resources/sidecar/houla-sidecar.exe \
                   resources/sidecar/ViGEmBusSetup_x64.msi \
                   resources/xinput-proxy/xinput1_4.dll \
                   resources/xinput-proxy/xinput1_3.dll \
                   resources/xinput-proxy/xinput9_1_0.dll; do
            if [ ! -s "$f" ]; then
              echo "::error::Artefact manquant : $f — absent de la release sidecar-bin-v1."
              echo "::error::Ce build produirait une app SANS pilotage manette. Arrêt."
              exit 1
            fi
            echo "OK  $f  ($(wc -c < "$f") octets)"
          done

      # ── Sidecar Linux / macOS : CONSTRUIT ICI, contrairement a Windows ──
      # La raison pour laquelle Windows ne peut pas etre construit en CI ne vaut QUE pour
      # Windows : `vgamepad` se connecte au pilote noyau ViGEmBus des l'import. Linux et
      # macOS n'ont besoin d'AUCUN pilote tiers :
      #   - Linux : `uinput` est dans le noyau. `evdev` cree une manette et un clavier
      #     virtuels sans rien installer, et il n'y a pas d'XInput donc pas de DLL proxy.
      #   - macOS : `CGEventPost` (pyobjc) est dans le systeme. Reste l'autorisation
      #     Accessibilite, que l'UTILISATEUR accorde une fois, pas le build.
      # Le figeage PyInstaller peut donc tourner sur les runners, et l'app cesse d'etre
      # livree sans son moteur d'entree sur ces deux systemes.
      #
      # ⚠️ BLOQUANT, comme le pas Windows au-dessus, et pour la meme raison deja payee :
      # un artefact manquant doit CASSER le build. Une release qui s'installe mais dont la
      # fonction principale est absente est pire qu'une release absente, parce que personne
      # ne le sait. Re-verification apres build : l'installeur doit contenir
      # `resources/sidecar/houla-sidecar`.
      - name: Construire le sidecar (Linux / macOS)
        if: matrix.os != 'windows-2022'
        shell: bash
        run: |
          set -euo pipefail
          # ENVIRONNEMENT VIRTUEL, et pas le Python systeme.
          # Les images macOS recentes marquent leur Python « externally managed »
          # (PEP 668) : `pip install` y est REFUSE, et le build macOS echouait
          # entierement la-dessus alors que Linux passait encore. Un venv est la
          # reponse portable, et elle ne depend pas de l'humeur de l'image.
          python3 -m venv "$RUNNER_TEMP/pyenv"
          PY="$RUNNER_TEMP/pyenv/bin/python"
          "$PY" -m pip install --upgrade pip pyinstaller
          # Les marqueurs PEP 508 de requirements.txt n'installent que ce qui concerne
          # CETTE plateforme (evdev sur Linux, pyobjc sur macOS, rien de Windows).
          "$PY" -m pip install -r resources/sidecar/requirements.txt
          "$PY" -m PyInstaller --onefile --name houla-sidecar             --distpath resources/sidecar --workpath "$RUNNER_TEMP/pyi-build"             --specpath "$RUNNER_TEMP/pyi-spec"             resources/sidecar/houla_sidecar.py
          BIN=resources/sidecar/houla-sidecar
          if [ ! -s "$BIN" ]; then
            echo "::error::Sidecar non construit sur ${{ matrix.os }} : $BIN absent ou vide."
            echo "::error::Ce build produirait une app SANS pilotage clavier/manette. Arret."
            exit 1
          fi
          chmod +x "$BIN"
          echo "OK  $BIN  ($(wc -c < "$BIN") octets)"
          # Le binaire doit DEMARRER et REPONDRE JUSTE : un fichier present ne prouve
          # pas qu'il s'execute (dependance native manquante, architecture incompatible).
          #
          # ⚠️ La requete envoyait `{"helper":...,"args":...}` alors que le protocole
          # attend `{"method":...,"params":...}` : le sidecar repondait donc TOUJOURS
          # « helper non verifie », et comme la sortie n'etait pas controlee, ce test
          # ne pouvait rien attraper d'autre qu'un binaire incapable de demarrer.
          # On envoie desormais la bonne forme, et on EXIGE un `result`.
          # ⚠️ `timeout` N'EXISTE PAS SUR macOS : userland BSD, pas GNU coreutils.
          # La commande sortait donc en 127 (« command not found ») et faisait
          # echouer TOUT le build macOS. Le defaut preexistait, masque par
          # l'echec de pip qui survenait plus tot.
          # Aucun garde-fou n'est perdu sans lui : le sidecar lit stdin jusqu'a
          # EOF, et `echo | binaire` ferme stdin, donc il ne peut pas rester
          # suspendu.
          if command -v timeout >/dev/null 2>&1; then TO="timeout 30"
          elif command -v gtimeout >/dev/null 2>&1; then TO="gtimeout 30"
          else TO=""; fi
          REP=$(echo '{"id":1,"method":"capabilities","params":{}}' | $TO "$BIN" | head -c 600)
          echo "$REP"
          case "$REP" in
            *'"result"'*) : ;;
            *) echo "::error::Le sidecar demarre mais ne repond pas correctement : $REP"; exit 1 ;;
          esac
      # Signature de code, UNIQUEMENT si les secrets sont configurés (sinon build non
      # signé, toujours téléchargeable ; SmartScreen/Gatekeeper alerteront) :
      #   - Windows : Azure Trusted Signing (secrets AZURE_*)
      #   - macOS   : Developer ID + notarisation (secrets APPLE_*)
      #   - Linux   : AppImage, pas de signature de code (rien à faire)
      # Procédure complète (réutilisable pour houla-print) : docs/CODE_SIGNING.md
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: true
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # macOS : signature Developer ID (cert .p12) + notarisation par CLÉ API App Store
          # Connect (pas de mot de passe app-specific). Le job mac ne s'en sert que s'ils
          # existent. Cert nommé APPLE_CSC_* pour NE PAS que le job Windows le prenne comme
          # cert Windows. APPLE_API_KEY_B64 = le .p8 (base64), décodé en fichier dans le run.
          APPLE_CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          APPLE_CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "${{ matrix.os }}" = "windows-2022" ] && [ -n "$AZURE_CLIENT_ID" ]; then
            echo "Signature Windows via Azure Trusted Signing"
            npx electron-builder --publish always \
              -c.win.azureSignOptions.endpoint="${{ secrets.AZURE_SIGN_ENDPOINT }}" \
              -c.win.azureSignOptions.codeSigningAccountName="${{ secrets.AZURE_SIGN_ACCOUNT }}" \
              -c.win.azureSignOptions.certificateProfileName="${{ secrets.AZURE_SIGN_PROFILE }}"
          elif [ "${{ matrix.os }}" = "macos-latest" ] && [ -n "$APPLE_CSC_LINK" ]; then
            # ── Le certificat est-il seulement UTILISABLE ? ────────────────
            # electron-builder importe le .p12 dans un trousseau temporaire.
            # Quand le certificat ou son mot de passe ne va pas, il echoue sur
            # `security set-key-partition-list` APRES avoir empaquete, et le job
            # entier tombe : plus AUCUNE build macOS n'est publiee. Constate le
            # 2026-09-09, ou macOS etait la seule plateforme manquante.
            #
            # On teste donc l'import AVANT, dans un trousseau jetable. S'il
            # passe, on signe et on notarise. S'il echoue, on publie une build
            # NON SIGNEE plutot que rien : Gatekeeper avertira l'utilisateur,
            # mais l'app existe et se telecharge.
            echo "$APPLE_CSC_LINK" | base64 -d > "$RUNNER_TEMP/cert.p12" 2>/dev/null || true
            KC="$RUNNER_TEMP/probe.keychain-db"
            SIGNABLE=0
            if [ -s "$RUNNER_TEMP/cert.p12" ]; then
              security create-keychain -p probe "$KC" 2>/dev/null || true
              security unlock-keychain -p probe "$KC" 2>/dev/null || true
              if security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$APPLE_CSC_KEY_PASSWORD" -T /usr/bin/codesign >/dev/null 2>&1 \
                 && security set-key-partition-list -S apple-tool:,apple: -s -k probe "$KC" >/dev/null 2>&1; then
                SIGNABLE=1
              fi
              security delete-keychain "$KC" 2>/dev/null || true
            fi
            rm -f "$RUNNER_TEMP/cert.p12"

            if [ "$SIGNABLE" = "1" ]; then
              echo "Signature Developer ID + notarisation macOS (clé API App Store Connect)"
              export CSC_LINK="$APPLE_CSC_LINK"
              export CSC_KEY_PASSWORD="$APPLE_CSC_KEY_PASSWORD"
              # Décode la clé API .p8 dans un fichier (electron-builder attend un CHEMIN).
              echo "$APPLE_API_KEY_B64" | base64 -d > "$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
              export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
              # APPLE_API_KEY_ID + APPLE_API_ISSUER sont déjà dans l'env (bloc env: ci-dessus).
              npx electron-builder --publish always -c.mac.notarize=true
            else
              echo "::warning::Certificat Apple INUTILISABLE (import refusé par le trousseau) : build macOS NON SIGNÉE."
              {
                echo "## ⚠️ macOS publié SANS signature"
                echo ""
                echo "Le secret \`APPLE_CSC_LINK\` est bien présent, mais le certificat"
                echo "(ou \`APPLE_CSC_KEY_PASSWORD\`) est refusé à l'import dans le trousseau."
                echo "La build est publiée quand même, **non signée** : Gatekeeper affichera"
                echo "un avertissement à l'ouverture, et il n'y a pas de notarisation."
                echo ""
                echo "Pour retrouver une build signée : réexporter le certificat Developer ID"
                echo "en \`.p12\`, le ré-encoder en base64, et remettre à jour les deux secrets."
              } >> "$GITHUB_STEP_SUMMARY"
              # `CSC_IDENTITY_AUTO_DISCOVERY=false` : sans lui, electron-builder
              # repart chercher une identite dans le trousseau et rejoue l'echec.
              CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --publish always
            fi
          else
            # Windows/macOS sans secrets, ou Linux (AppImage : pas de signature de code
            # côté desktop Linux) : build non signé, toujours téléchargeable.
            npx electron-builder --publish always
          fi
