name: Tests

# Sur les PR et les branches de travail. (Sur `main`, c'est release.yml qui lance les
# TU en amont du bump/publish -> pas de doublon ici.)
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  # TU (node:test) — BLOQUANT : une régression de logique casse la CI avant merge.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Tests unitaires (node --test)
        run: npm test

  # E2E (Playwright + Electron) — FONDATION. Non bloquant tant que le lancement Electron
  # headless en CI n'est pas stabilisé (xvfb + libs natives) ; à passer bloquant une fois vert.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Dépendances système (GTK/NSS… pour Electron)
        run: npx playwright install-deps
      - run: npm run build
      - name: E2E (sous xvfb)
        run: xvfb-run -a npm run test:e2e
