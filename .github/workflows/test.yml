name: Tests

# Sur les PR et les branches de travail. (Sur `main`, c'est release.yml qui lance les
# TU en amont du bump/publish -> pas de doublon ici.)
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  # TU (node:test) — BLOQUANT : une régression de logique casse la CI avant merge.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Tests unitaires (node --test)
        run: npm test

  # E2E "renderer" (Chromium headless, API mockée) — BLOQUANT. Teste le VRAI renderer +
  # l'UI + les gardes (dont l'anti-perte-de-données du Lab), sans Electron ni OAuth.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Navigateur Chromium (+ deps système)
        run: npx playwright install --with-deps chromium
      - name: E2E renderer (Playwright + Chromium)
        run: npm run test:e2e
